<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Japan per Spoor 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: één leeskolom als een spoorboekje; een verticale lijnkaart van sneeuwblauw naar zonoranje verbindt de stations. */
:root{
  --paper:#F3F6F9; --card:#FFFFFF; --ink:#142033; --muted:#566275; --line:#D3DCE6;
  --ai:#24427A; --cold:#3E7DBD; --warm:#D47A22; --chip:#E6ECF3;
  --mtn:#1D2C44; --snow:#FFFFFF; --torii:#C9442C; --neon1:#E8488A; --neon2:#2FB6D6;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1520; --card:#162030; --ink:#E5EBF2; --muted:#9AA7B8; --line:#273447;
  --ai:#94B6EA; --cold:#6FA6DE; --warm:#EBA25E; --chip:#1F2B3D;
  --mtn:#070B12; --snow:#C9D6E6; --torii:#E0654C; --neon1:#FF6FA8; --neon2:#5FD3EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1520; --card:#162030; --ink:#E5EBF2; --muted:#9AA7B8; --line:#273447;
  --ai:#94B6EA; --cold:#6FA6DE; --warm:#EBA25E; --chip:#1F2B3D;
  --mtn:#070B12; --snow:#C9D6E6; --torii:#E0654C; --neon1:#FF6FA8; --neon2:#5FD3EE; color-scheme:dark}
/* illustraties en overzichtskaarten */
.scene{display:block;width:100%;height:auto;max-width:100%}
.banner{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative}
.banner .scene{aspect-ratio:600/220}
.pano{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:22px 0 0}
.pano .scene{aspect-ratio:1200/300}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.stats div{background:var(--card);padding:12px 14px}
.stats b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.glance{display:grid;gap:16px;margin-top:8px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.gcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--mtn) 14%,transparent)}
.gcard .scene{aspect-ratio:600/200;border-bottom:1px solid var(--line)}
.gcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard .head{display:flex;align-items:center;gap:12px}
.gcard .badge{width:40px;height:40px;font-size:13px;border-width:3px;flex:none}
.gcard .head b{font-size:19px;display:block;line-height:1.2}
.gcard .head .kj{white-space:nowrap;font-family:var(--display);color:var(--muted);font-size:15px;margin-left:auto}
.gcard .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gcard ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.gcard li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14px;align-items:baseline}
.gcard li span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gcard .after{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:12px;color:var(--muted)}
.gcard .after.boat{color:var(--ai)}
@media (min-width:700px){.glance{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.gcard li{grid-template-columns:84px 1fr}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--ai);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.06em}
nav.quick{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.quick a{font-size:13px;text-decoration:none;color:var(--ink);padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
nav.quick a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{padding-block:28px 64px}
h1,h2,h3{text-wrap:balance;line-height:1.2}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);margin:0}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:40px 0 12px}
h3{font-size:16px;font-weight:700;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;color:var(--ink);max-width:62ch}
p{max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:14px}
/* route line */
.route{list-style:none;margin:24px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:4px;border-radius:2px;background:linear-gradient(var(--cold),var(--cold) 45%,var(--warm))}
.route li{position:relative}
.route a.stn{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);padding:10px 0}
.badge{width:46px;height:46px;border-radius:50%;background:var(--card);border:4px solid var(--c,var(--cold));display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;position:relative;z-index:1}
.stn .nm{min-width:0}
.stn .nm b{font-size:18px;display:block}
.stn .nm span{font-size:13px;color:var(--muted)}
.stn .kj{font-family:var(--display);font-size:20px;color:var(--muted)}
.route li.leg{padding:2px 0 2px 64px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.route li.leg.boat{color:var(--ai)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:8px;padding:14px 16px;margin:20px 0}
.note b{display:block;margin-bottom:2px}
/* stop hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.hero .badge{width:64px;height:64px;font-size:18px;border-width:5px}
.hero .kj{font-family:var(--display);font-size:20px;color:var(--muted);display:block;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.fact span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.therm{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--warm));position:relative;margin-top:8px;width:140px}
.therm i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink);transform:translateX(-50%)}
.getthere{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:20px}
.getthere h3{margin-bottom:6px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.filters button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.tips{display:grid;gap:10px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tip .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tip h3{margin:2px 0 4px}
.tip p{margin:0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px}
.stays{display:grid;gap:10px}
.stay{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stay .row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.yes{background:color-mix(in srgb,var(--cold) 22%,var(--card))}
.pill.warm{background:color-mix(in srgb,var(--warm) 25%,var(--card))}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pager a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);min-width:0}
.pager a span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pager a.next{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
tr:last-child td{border-bottom:0}
ul.plain{padding-left:20px;margin:8px 0}
ul.plain li{margin:4px 0}
.sec{scroll-margin-top:80px}
.sources{font-size:13px;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
.empty{color:var(--muted);font-style:italic}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.toc a{font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card)}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media (min-width:640px){.tips{grid-template-columns:1fr 1fr}.stays{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.brand small{display:none}.hero .badge{width:52px;height:52px;font-size:16px}.stn .kj{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

 get:{text:"Vanaf Haneda rijdt de Keikyu-lijn door naar Asakusa. Vanaf Narita neem je de Keisei-lijn richting Ueno of Asakusa. Zet je Suica al in je telefoon voor je landt.",from:"Haneda Airport",to:"Asakusa Station"},

 ],
 stay:[

{id:"nikko",n:"02",name:"Oku-Nikko",kj:"奥日光",nights:2,days:"Dag 5–6",hi:-2,lo:-12,
 intro:"Eerst de tempels van Nikko-stad, daarna omhoog naar Yumoto Onsen op 1500 meter. Daar ligt het bevroren Yunoko-meer onder de vulkaan Nantai-san, en ga je op sneeuwschoenen over de hoogvlakte van Senjogahara. 's Avonds bad je in melkwit zwavelwater.",
 get:{text:"Tobu-trein vanaf Asakusa naar Tobu-Nikko (de gewone sneltreinen doen er ca. 2 uur 40 over), daarna de Tobu-bus naar Yumoto Onsen (ca. 90 min). De NIKKO PASS All Area dekt dit allemaal; zie Praktisch.",from:"Asakusa Station",to:"Yumoto Onsen Nikko"},
 note:"Reis doordeweeks omhoog en blijf slapen in Yumoto. Als de dagjesmensen 's middags vertrekken, heb je het dorp en het meer voor jezelf.",
 tips:[
  {c:"cultuur",t:"Toshogu en Taiyuin",d:"Het uitbundig versierde schrijncomplex van Nikko. Taiyuin ernaast is soberder en veel rustiger.",m:"Nikko Toshogu"},
  {c:"cultuur",t:"Shinkyo-brug",d:"De rode brug over de Daiya-rivier bij de ingang van het tempelgebied. Mooi met sneeuw op de oevers.",m:"Shinkyo Bridge Nikko"},
  {c:"cultuur",t:"Kanmangafuchi",d:"Een stil pad langs een kloof met een lange rij stenen boeddhabeeldjes met rode mutsjes. Weinig mensen, zeker in de sneeuw.",m:"Kanmangafuchi Abyss"},
  {c:"natuur",t:"Sneeuwschoenen op Senjogahara",d:"Een hoogveen op 1400 meter tussen het Chuzenji-meer en Yumoto. Bij de rusthuizen bij bushalte Sanbonmatsu kun je sneeuwschoenen huren voor ca. ¥500 per 2 uur of ¥1000 per dag.",m:"Senjogahara Marshland",l:"https://www.japan-guide.com/e/e3811.html",lt:"japan-guide"},
  {c:"natuur",t:"Rondje Yunoko",d:"Het meer naast Yumoto ligt 's winters (deels) bevroren. Wandel langs de oever naar de Yudaki-waterval.",m:"Lake Yunoko"},
  {c:"natuur",t:"Begeleid naar het Karikomi-meer",d:"Kanto Adventures loopt met kleine groepen naar het bevroren Karikomi-meer en eindigt in het onsen van Yumoto.",m:"Lake Karikomi",l:"https://www.kantoadventures.com/nikko-alpine-lakes-snowshoe-and-onsen.html",lt:"Kanto Adventures"},
  {c:"natuur",t:"Kegon-waterval",d:"Een waterval van bijna 100 meter bij het Chuzenji-meer, in de winter deels met ijspegels. Je stapt uit bij Chuzenji-onsen.",m:"Kegon Falls"},
  {c:"chillen",t:"Zwavelbad in Yumoto",d:"Het water van Yumoto behoort tot de meest zwavelrijke van Japan, melkwit en stomend in de sneeuw. Slaap er een nacht en bad 's avonds en 's ochtends.",m:"Yumoto Onsen Nikko"},
  {c:"chillen",t:"Sneeuwfestival",d:"In januari en februari is er een sneeuwfestival in Yumoto.",l:"https://en.japantravel.com/tochigi/nikko-a-winter-wonderland/18525",lt:"Japan Travel"},
  {c:"eten",t:"Yuba",d:"De specialiteit van Nikko: vellen van sojamelk, in soep, op rijst of gefrituurd. Probeer het rond de tempels.",m:"yuba restaurant Nikko"}
 ],

{id:"yudanaka",n:"03",name:"Yudanaka & Shibu",kj:"湯田中・渋",nights:2,days:"Dag 7–8",hi:3,lo:-6,
 intro:"Twee onsendorpjes aan elkaar, in de bergen boven Nagano. Wilde makaken zitten hier in de sneeuw in een warme bron, en 's avonds loop je in yukata van badhuisje naar badhuisje.",
 get:{text:"Vanaf Nikko met de JR naar Utsunomiya, Tohoku-Shinkansen naar Omiya en Hokuriku-Shinkansen naar Nagano. Daar stap je over op de Nagano Dentetsu-lijn naar Yudanaka (ca. 45 min).",from:"Nagano Station",to:"Yudanaka Station"},
 tips:[
  {c:"natuur",t:"Jigokudani: de sneeuwapen",d:"Een wandeling van ca. 30 minuten door een besneeuwd bos naar het warme bad van de makaken. Ga vroeg, dan is het rustiger. Veel ryokans brengen je naar het begin van het pad.",m:"Jigokudani Monkey Park"},
  {c:"chillen",t:"De negen baden van Shibu",d:"In Shibu Onsen staan negen kleine openbare badhuisjes. Overnachtende gasten krijgen vaak een sleutel, en je kunt een handdoek laten stempelen bij elk bad.",m:"Shibu Onsen"},
  {c:"cultuur",t:"Zenko-ji in Nagano",d:"Een van de belangrijkste tempels van Japan. Onder het altaar loop je door een pikdonkere gang op zoek naar de 'sleutel naar het paradijs'. Stop hier op weg naar Yudanaka.",m:"Zenko-ji Nagano"},
  {c:"natuur",t:"Shiga Kogen",d:"Een groot berggebied net boven Yudanaka, met sneeuwschoenroutes tussen bevroren meertjes. Een rustige dag in de sneeuw.",m:"Shiga Kogen"},
  {c:"eten",t:"Soba en oyaki",d:"Nagano staat bekend om boekweitnoedels en oyaki: gevulde deegbolletjes met groente of zoete bonen.",m:"soba Yudanaka"},
  {c:"cultuur",t:"Obuse",d:"Een klein stadje aan dezelfde treinlijn, met kastanjes, sake-brouwerijen en houten pakhuizen. Een halve dag is genoeg.",m:"Obuse"}
 ],
 stay:[
  {n:"Shimaya",a:"Yudanaka",d:"Familie-ryokan met in 2026 nog vrijwel alleen 5-sterrenreviews. De eigenaren brengen je naar het apenpark en lenen sneeuwlaarzen uit.",tw:"yes",m:"Shimaya Ryokan Yudanaka",l:"https://www.tiket.com/homes/japan/shimaya-108001534517761255"},
  {n:"Uotoshi Ryokan",a:"Yudanaka",d:"Volgens gasten heel goede prijs-kwaliteit, met een shuttle naar het apenpark en een boogschietbaan achter het huis.",tw:"yes",m:"Uotoshi Ryokan Yudanaka"},
  {n:"Maruka Ryokan",a:"Yudanaka",d:"Eenvoudig en goedkoop; ophaalservice van het station. Geen creditcards.",tw:"yes",m:"Maruka Ryokan Yudanaka"}

{id:"kanazawa",n:"04",name:"Kanazawa",kj:"金沢",nights:3,days:"Dag 9–11",hi:7,lo:1,
 intro:"Een compacte cultuurstad aan de Japanse Zee, met theehuisstraatjes, een samoeraiwijk, hedendaagse kunst en in januari krabseizoen. Vanaf hier ga je naar het besneeuwde dorp Shirakawa-go.",
 get:{text:"Hokuriku-Shinkansen van Nagano naar Kanazawa, ca. 1 uur.",from:"Nagano Station",to:"Kanazawa Station"},
 note:"De avondverlichting in Shirakawa-go is in 2027 op 11, 17, 24 en 31 januari, van 17:30 tot 19:30, en alleen met reservering. Plan Kanazawa rond 17 januari als je dat wilt zien.",
 tips:[
  {c:"cultuur",t:"Kenrokuen met yukitsuri",d:"Een van de drie mooiste tuinen van Japan. In de winter hangen de bomen in kegels van touw tegen de sneeuwlast. Ga bij opening, dan heb je de tuin bijna voor jezelf.",m:"Kenrokuen Garden"},
  {c:"cultuur",t:"Nagamachi",d:"De samoeraiwijk met lemen muren die in de winter onder strooien matten worden ingepakt tegen de vorst.",m:"Nagamachi Samurai District"},
  {c:"cultuur",t:"Higashi Chaya",d:"Houten theehuisstraatjes. Kom vroeg in de ochtend; de souvenirwinkels kun je overslaan.",m:"Higashi Chaya District"},
  {c:"cultuur",t:"21st Century Museum",d:"Een rond, glazen museum voor hedendaagse kunst, gratis toegankelijk in de publieke delen. Het hoogtepunt van Kanazawa voor ontwerpers.",m:"21st Century Museum of Contemporary Art Kanazawa"},
  {c:"cultuur",t:"D.T. Suzuki Museum",d:"Een minimalistisch museum rond een waterspiegel, ontworpen door Yoshio Taniguchi. Een plek om stil te zitten.",m:"D.T. Suzuki Museum"},
  {c:"cultuur",t:"Myoryu-ji, de ninjatempel",d:"Een tempel vol valluiken, geheime trappen en verborgen kamers. Bezoek alleen met een rondleiding; reserveer vooraf.",m:"Myoryuji Temple Kanazawa"},
  {c:"natuur",t:"Shirakawa-go",d:"Werelderfgoeddorp met boerderijen met rieten daken onder een dikke laag sneeuw. Geen station: de bus vanaf Kanazawa doet er ca. 75 minuten over en je moet je stoel reserveren.",m:"Shirakawa-go Ogimachi",l:"https://selfguidejapan.com/blog/shirakawa-go",lt:"Self Guide Japan"},
  {c:"natuur",t:"Shirakawa-go light-up",d:"Op vier avonden in januari is het dorp verlicht. Toegang alleen met een vooraf gereserveerd ticket.",l:"https://shirakawa-go.gr.jp/lightup",lt:"Officiële light-up-pagina"},
  {c:"eten",t:"Omicho-markt",d:"Ga voor de lunch: kaisendon (rijst met rauwe vis), oesters en krab. Veel kramen sluiten 's middags.",m:"Omicho Market"},
  {c:"eten",t:"Kanazawa-oden",d:"Een winters stoofpotje met onder andere krab en vispasteitjes, typisch voor de stad. Zoek een kleine oden-bar in Katamachi.",m:"oden Kanazawa"},
  {c:"eten",t:"Kanazawa-curry",d:"Dikke, donkere curry met een kotelet erop, in een metalen schaal. Goedkoop en vullend.",m:"Kanazawa curry"},
  {c:"shoppen",t:"Tatemachi en Katamachi",d:"Kleine winkeltjes en vintage overdag; 's avonds de barretjes in de steegjes.",m:"Tatemachi Kanazawa"}
 ],

{id:"kyoto",n:"05",name:"Kyoto & Nara",kj:"京都",nights:4,days:"Dag 12–15",hi:9,lo:1,
 intro:"Januari is laagseizoen, en met een beetje geluk ligt er sneeuw op de tempeldaken. Doe de bekende plekken bij zonsopgang en zoek daarna de stille tempels in het noorden op. Kyoto is wel de duurste stad om te slapen; boek op tijd.",
 get:{text:"Van Kanazawa met de Hokuriku-Shinkansen naar Tsuruga en daar overstappen op de Thunderbird naar Kyoto, samen ca. 2 uur.",from:"Kanazawa Station",to:"Kyoto Station"},
 note:"Op de 21e van elke maand is er een grote rommelmarkt bij Toji, op de 25e bij Kitano Tenmangu. Probeer je dagen zo te plannen dat je er een meepakt.",
 tips:[
  {c:"cultuur",t:"Fushimi Inari bij zonsopgang",d:"Duizenden rode torii de berg op. Begin voor zeven uur en loop door tot boven: hoe hoger, hoe stiller.",m:"Fushimi Inari Taisha"},
  {c:"cultuur",t:"Kiyomizu-dera",d:"De houten tempel op palen boven de stad. Ga om zes uur 's ochtends, dan loop je ook rustig door Sannenzaka en Ninenzaka.",m:"Kiyomizu-dera"},
  {c:"cultuur",t:"Kinkaku-ji",d:"De Gouden Tempel, op zijn mooist met sneeuw. Check 's ochtends het weer en ga meteen als er sneeuw ligt.",m:"Kinkaku-ji"},
  {c:"cultuur",t:"Ginkaku-ji en het Pad van de Filosoof",d:"Een rustiger tempel met een zandtuin, daarna langs het kanaal naar Nanzen-ji met zijn bakstenen aquaduct.",m:"Ginkaku-ji"},
  {c:"cultuur",t:"Ryoan-ji",d:"De beroemdste zen-rotstuin van Japan. Ga bij opening en ga gewoon even zitten.",m:"Ryoan-ji"},
  {c:"cultuur",t:"Tofuku-ji",d:"Grote zentempel met moderne tuinen met mosblokken. In de winter bijna leeg.",m:"Tofuku-ji"},
  {c:"natuur",t:"Arashiyama bij zonsopgang",d:"Het bamboebos voor acht uur, daarna Tenryu-ji en de Okochi-Sanso-tuin met uitzicht over de stad.",m:"Arashiyama Bamboo Grove"},
  {c:"natuur",t:"Kurama naar Kibune",d:"Een bergwandeling van ca. 2 uur van de Kurama-tempel naar de Kibune-schrijn, door cederbos. Met sneeuw prachtig; neem schoenen met grip.",m:"Kurama-dera"},
  {c:"natuur",t:"Ohara",d:"Een dorpje in de bergen ten noorden van Kyoto met de tempel Sanzen-in en mostuinen. In januari stil en vaak besneeuwd.",m:"Sanzen-in Ohara"},
  {c:"cultuur",t:"Nara",d:"Ca. 45 minuten met de trein. Todai-ji met de grote Boeddha, de herten en de wandeling door het Kasuga-bos.",m:"Todai-ji Nara"},
  {c:"cultuur",t:"Gion en Pontocho in de avond",d:"Houten straatjes en lantaarns. Kijk, maar fotografeer geen geiko of maiko van dichtbij; dat wordt niet gewaardeerd.",m:"Pontocho Kyoto"},
  {c:"shoppen",t:"Rommelmarkt Toji (21e)",d:"Kimono's, keramiek, antiek en streetfood rond een vijf verdiepingen hoge pagode.",m:"Toji Temple Kyoto"},
  {c:"shoppen",t:"Rommelmarkt Kitano Tenmangu (25e)",d:"Vintage kimono's, oude gereedschappen en snacks rond een schrijn vol pruimenbomen.",m:"Kitano Tenmangu"},
  {c:"shoppen",t:"Teramachi en Shinkyogoku",d:"Overdekte winkelstraten met vintage, platen en kleine winkeltjes.",m:"Teramachi Shopping Arcade"},
  {c:"eten",t:"Demachi Masugata",d:"Een lokale overdekte winkelstraat met goedkope eettentjes, minder toeristisch dan de Nishiki-markt.",m:"Demachi Masugata Shopping Street"},
  {c:"eten",t:"Yudofu",d:"Tofu in een heet bad, het typische winterse gerecht van Kyoto. Rond Nanzen-ji en in Arashiyama.",m:"yudofu Nanzenji"},
  {c:"eten",t:"Kaiseki-lunch",d:"Een meergangenlunch in Kyoto-stijl; veel goedkoper dan dezelfde kaiseki 's avonds.",m:"kaiseki lunch Kyoto"},
  {c:"chillen",t:"Funaoka Onsen",d:"Een badhuis uit 1923 met buitenbad, sauna, cipressenhouten bad en houtsnijwerk in de kleedkamer. Volgens Lonely Planet het beste badhuis van Kyoto.",m:"Funaoka Onsen Kyoto",l:"https://www.lonelyplanet.com/points-of-interest/funaoka-onsen/402576",lt:"Lonely Planet"},
  {c:"chillen",t:"Sauna no Umeyu",d:"Een eigenzinnig oud badhuis dat populair is bij locals en reizigers.",m:"Sauna no Umeyu Kyoto",l:"https://jw-webmagazine.com/tips/best-sento-in-kyoto/",lt:"Japan Web Magazine"},
  {c:"chillen",t:"Kurama Onsen",d:"Een echte warmwaterbron in de bergen; perfect na de wandeling van Kibune naar Kurama.",m:"Kurama Onsen"},
  {c:"chillen",t:"Tenzan-no-yu",d:"Een groot onsencomplex met echt bronwater bij Arashiyama.",m:"Tenzan no Yu Kyoto",l:"https://www.insidekyoto.com/kyotos-best-sentos-japanese-public-baths",lt:"Inside Kyoto"}

{id:"osaka",n:"06",name:"Osaka",kj:"大阪",nights:2,days:"Dag 16–17",hi:10,lo:3,
 intro:"De eetstad van Japan: harder, luider en goedkoper dan Kyoto. Op de laatste avond stap je hier op de nachtboot en word je de volgende ochtend wakker in Kyushu.",

 tips:[

  {c:"gek",t:"Den Den Town",d:"Het Akihabara van Osaka: speelhallen, gachapon, karaoke, retrogames en tweedehands vinyl.",m:"Den Den Town Osaka",l:"https://www.jrpass.com/blog/what-to-do-in-denden-town-osaka",lt:"JR Pass blog"},
  {c:"gek",t:"Shinsekai 's avonds",d:"Neon, bizarre gevelversieringen en een retro uitstraling. In het steegje Janjan Yokocho zitten kleine barretjes, waarvan sommige karaoke hebben voor vaste gasten.",m:"Shinsekai Osaka",l:"https://voyapon.com/de/shinsekai-osaka/",lt:"Voyapon"},

{id:"beppu",n:"07",name:"Beppu",kj:"別府",nights:2,days:"Dag 18–20",hi:10,lo:3,
 intro:"Je stapt van de boot in een stad die stoomt: in Kannawa komt de damp uit de straatputten. Beppu heeft acht onsenwijken en meer bronnen dan bijna waar ook ter wereld. Hier ga je baden, in water, zand, stoom en modder.",
 get:{text:"De nachtboot komt 's ochtends aan in de haven; de bus naar Beppu Station duurt ca. 15 minuten. Naar Kannawa neem je de stadsbus.",from:"Beppu Station",to:"Kannawa Onsen Beppu"},
 tips:[
  {c:"chillen",t:"Hyotan Onsen",d:"Het enige onsen in Japan met drie sterren in de Michelin Green Guide. Meer dan tien soorten baden, waaronder zand, stoom en watervallen.",m:"Hyotan Onsen Beppu",l:"https://onsenoni.com/en/onsenchi/beppu",lt:"Onsen Oni"},
  {c:"chillen",t:"Kannawa Steam Bath",d:"Je ligt in een stenen stoomkamer op een bed van geneeskrachtige kruiden, met vulkanische stoom van 60–70 °C. Acht tot tien minuten is genoeg.",m:"Kannawa Mushiyu"},
  {c:"chillen",t:"Takegawara Onsen",d:"Een historisch badhuis bij het station. Een gewoon bad kost ¥300, het zandbad ¥1.500 inclusief yukata.",m:"Takegawara Onsen"},
  {c:"chillen",t:"Myoban Yunosato",d:"Baden met uitzicht over de baai, tussen rieten hutten waar al eeuwen badzout uit de stoom wordt gewonnen.",m:"Myoban Yunosato",l:"https://www.tokyoweekender.com/?p=247188",lt:"Tokyo Weekender"},
  {c:"chillen",t:"Modderbad in Hoyoland",d:"Een rustiek modderbad in de heuvels.",m:"Beppu Onsen Hoyoland"},
  {c:"chillen",t:"Zandbad aan het strand",d:"Laat je ingraven in warm zand met uitzicht over de baai.",m:"Beppu Beach Sand Bath"},
  {c:"natuur",t:"De 'Hells' van Kannawa",d:"Kokende bronnen in felle kleuren: kobaltblauw, bloedrood, borrelende modder. Doe er een paar, niet alle zeven.",m:"Umi Jigoku Beppu"},
  {c:"natuur",t:"Miharashi-zaka",d:"Een helling met uitzicht over Kannawa, met overal stoompluimen boven de daken.",m:"Yukemuri Observatory Beppu"},
  {c:"eten",t:"Jigoku-mushi koken",d:"Bij Jigoku Mushi Kobo koop je groenten, eieren of vis uit een automaat en stoom je ze zelf boven een natuurlijke stoombron van 100 °C.",m:"Jigokumushi Kobo Kannawa",l:"https://japanactivity.com/rainy-day-in-beppu",lt:"Japan Activity"},
  {c:"eten",t:"Toriten",d:"Kip in tempurabeslag, de specialiteit van de provincie Oita.",m:"toriten Beppu"},
  {c:"eten",t:"Beppu-reimen",d:"Koude noedels in een heldere bouillon. Een vreemde maar goede combinatie na een warm bad.",m:"reimen Beppu"},
  {c:"shoppen",t:"Retro steegjes rond Takegawara",d:"Nog niet opgepoetst voor toeristen: oude winkelgalerijen, kleine barretjes en goedkope eettentjes.",m:"Takemachi Arcade Beppu"}

{id:"kurokawa",n:"08",name:"Kurokawa Onsen",kj:"黒川温泉",nights:1,days:"Dag 21",hi:6,lo:-3,
 intro:"Een van de mooiste onsendorpjes van Japan, in een bebost dal op ca. 700 meter. Met een houten pas kies je drie buitenbaden van de ryokans, en 's winters staat het dorp 's avonds vol bamboelantaarns.",
 get:{text:"Er is geen station. De Kyushu Odan-bus verbindt Beppu, Yufuin, Kurokawa, Aso en Kumamoto; stap onderweg uit in Yufuin en reis de volgende dag via Aso door. Check de wintertijden vooraf.",from:"Beppu Station",to:"Kurokawa Onsen"},
 note:"Slapen is hier duurder dan elders, want het zijn bijna allemaal ryokans. Wil je besparen, maak er dan een dagtrip van; overnachten wordt wel sterk aangeraden.",
 tips:[
  {c:"chillen",t:"Nyuto tegata: de houten badpas",d:"Voor ¥1.500 kies je 3 van de ca. 25 buitenbaden van de ryokans. De pas is een half jaar geldig.",l:"https://watabi.org/en/articles/kurokawa-onsen-guide",lt:"Watabi"},
  {c:"chillen",t:"Privébad voor twee",d:"Bij veel ryokans kun je een privébad (kashikiri) huren. Handig als je samen wilt baden of tatoeages hebt.",l:"https://www.japan.travel/en/spot/643/",lt:"Japan Travel"},
  {c:"cultuur",t:"Yuakari",d:"Van half december tot eind maart staan er 's avonds honderden bamboelantaarns langs de straatjes en de rivier. Gratis.",m:"Kurokawa Onsen",l:"https://www.tokyoweekender.com/location/kurokawa-onsen/",lt:"Tokyo Weekender"},
  {c:"natuur",t:"Yufuin en het Kinrin-meer",d:"Stop onderweg in Yufuin. Op koude winterochtenden hangt er mist boven het Kinrin-meer, doordat er warm bronwater in stroomt.",m:"Lake Kinrin Yufuin"},
  {c:"natuur",t:"Aso: de caldera",d:"Een van de grootste vulkaankraters ter wereld, met graslanden en de rokende Nakadake. De krater is regelmatig gesloten door gas; check de status op de dag zelf.",m:"Kusasenri Aso"},
  {c:"eten",t:"Sake- en shochu-pas",d:"Er is ook een pas om sake en shochu te proeven op drie plekken in het dorp.",l:"https://www.japan.travel/en/spot/643/",lt:"Japan Travel"}
 ],
 stay:[
  {n:"Ryokan in Kurokawa",a:"Kurokawa",d:"Bijna alles is een ryokan, vaak met diner en ontbijt. Zoek op 'kamer zonder diner' voor een lagere prijs, en boek ruim op tijd.",tw:"yes",m:"Kurokawa Onsen ryokan"}
 ],
 photo:"Kurokawa onsen yuakari winter"},

{id:"kirishima",n:"09",name:"Kirishima",kj:"霧島",nights:2,days:"Dag 22–23",hi:8,lo:-2,

  {c:"natuur",t:"Karakuni-dake",d:"De hoogste top van het gebied, ca. 1700 meter, met uitzicht over meerdere kraters en meren. Alleen bij goed weer en met stevige schoenen.",m:"Mount Karakuni"},

  {c:"chillen",t:"Kirishima Onsen",d:"Een onsendorp met hoogwaardig zwavelwater en veel verschillende baden.",m:"Kirishima Onsen",l:"https://www.japan-guide.com/tour/e/south/day4.html",lt:"japan-guide"},
  {c:"chillen",t:"Shinyu Onsen",d:"Een rustiek onsen, onder andere met een bad dat uit een boomstam is gehakt.",m:"Shinyu Onsen Kirishima"}
 ],
 stay:[
  {n:"Ryokan in Kirishima Onsen",a:"Maruo / Kirishima Onsen",d:"Een ryokan met eigen zwavelbad. Deze nachten zijn iets duurder; boek met ontbijt.",tw:"yes",m:"Kirishima Onsen ryokan"}

  const active = state.filter[key] || "alle";

 gassho:(x,base,s)=>`<rect x="${x-30*s}" y="${base-22*s}" width="${60*s}" height="${22*s}" style="fill:var(--mtn)"/><rect x="${x-8*s}" y="${base-16*s}" width="${8*s}" height="${8*s}" style="fill:var(--warm)"/><path d="M${x-40*s},${base-20*s} L${x},${base-78*s} L${x+40*s},${base-20*s} Z" style="fill:${mix("var(--warm)",28,"var(--mtn)")}"/><path d="M${x-28*s},${base-36*s} L${x},${base-80*s} L${x+28*s},${base-36*s} L${x+14*s},${base-40*s} L${x},${base-34*s} L${x-14*s},${base-40*s} Z" style="fill:var(--snow)"/>`,
 steam:(x,base,s,r)=>{let g="";for(let i=0;i<3;i++){const sx=x+(i-1)*14*s;let d=`M${sx},${base}`;for(let k=1;k<=4;k++){d+=` q${(k%2?10:-10)*s},${-12*s} 0,${-24*s}`;}g+=`<path d="${d}" fill="none" style="stroke:var(--snow)" stroke-width="${5*s}" stroke-linecap="round" opacity="${(0.45+r()*0.35).toFixed(2)}"/>`;}return g;},
 lantern:(x,y,s)=>`<circle cx="${x}" cy="${y}" r="${16*s}" style="fill:var(--warm)" opacity=".22"/><ellipse cx="${x}" cy="${y}" rx="${7*s}" ry="${9*s}" style="fill:var(--torii)"/><rect x="${x-4*s}" y="${y-11*s}" width="${8*s}" height="${3*s}" style="fill:var(--mtn)"/>`,
 volcano:(x,base,s)=>`<path d="M${x-140*s},${base} L${x-22*s},${base-92*s} L${x+22*s},${base-92*s} L${x+140*s},${base} Z" style="fill:var(--mf)"/><g style="fill:var(--snow)" opacity=".55"><circle cx="${x+4*s}" cy="${base-104*s}" r="${10*s}"/><circle cx="${x+18*s}" cy="${base-120*s}" r="${14*s}"/><circle cx="${x+40*s}" cy="${base-136*s}" r="${18*s}"/></g>`,
 pines:(x0,w,base,r,s)=>{let g="";for(let x=x0;x<x0+w;x+=14+r()*16){const h=(22+r()*20)*s;g+=`<path d="M${x},${base-h} L${x-h*0.32},${base} L${x+h*0.32},${base} Z" style="fill:var(--mtn)"/>`;}return g;},
 boat:(x,y,s)=>`<path d="M${x-46*s},${y-10*s} L${x+46*s},${y-10*s} L${x+36*s},${y+4*s} L${x-38*s},${y+4*s} Z" style="fill:var(--mtn)"/><rect x="${x-24*s}" y="${y-22*s}" width="${40*s}" height="${12*s}" style="fill:var(--mtn)"/><rect x="${x-18*s}" y="${y-18*s}" width="${28*s}" height="3" style="fill:var(--warm)"/>`
};

 kanazawa:{front:(r)=>M.gassho(140,214,1)+M.gassho(290,214,1.25)+M.gassho(450,214,0.95)+M.pines(520,90,214,r,.8)},
 kyoto:{front:(r)=>M.pagoda(160,214,1.05)+M.torii(420,214,1.25)+M.pines(0,90,214,r,.8)},

 kurokawa:{front:(r)=>M.pines(0,600,214,r,1.1)+M.steam(300,206,1,r)+[80,170,260,350,440,530].map((x,i)=>M.lantern(x,150+(i%2)*10,1)).join("")},

 kagoshima:{water:true,back:(r)=>M.volcano(330,176,1.1),front:(r)=>M.skyline(0,150,214,r,false)},
 fukuoka:{water:true,front:(r)=>M.skyline(60,340,186,r,false)+[440,480,520,560].map(x=>M.lantern(x,176,0.9)).join("")}

function scene(id, hi, idx){
  const W=600,H=220,r=rng(idx*977+13),t=Math.round(Math.max(0,Math.min(1,(hi+2)/15))*100);
  const sky=mix("var(--warm)",t,"var(--cold)"), cfg=SCN[id]||{}, gid="g"+id+idx+Math.floor(Math.random()*1e6);
  const snowy=hi<8, warmSun=hi>=9;
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="--mf:${mix("var(--mtn)",55,sky)}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${mix(sky,60,"var(--paper)")}"/><stop offset="1" style="stop-color:var(--paper)"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${gid})"/>`;
  s+=`<circle cx="${warmSun?480:110}" cy="58" r="${warmSun?28:20}" style="fill:${warmSun?mix("var(--warm)",85,"var(--paper)"):"var(--snow)"}" opacity="${warmSun?1:.75}"/>`;
  s+=`<path d="${ridge(W,H,118,34,30,r)}" style="fill:${snowy?mix("var(--snow)",70,sky):mix("var(--mtn)",22,sky)}"/>`;
  if(cfg.back) s+=cfg.back(r);
  s+=`<path d="${ridge(W,H,160,26,24,r)}" style="fill:${mix("var(--mtn)",45,sky)}"/>`;
  if(cfg.water){ s+=`<rect y="178" width="${W}" height="${H-178}" style="fill:${mix(sky,55,"var(--mtn)")}"/>`; for(let i=0;i<7;i++) s+=`<rect x="${(r()*W).toFixed(0)}" y="${(186+r()*28).toFixed(0)}" width="${(30+r()*60).toFixed(0)}" height="2" style="fill:var(--snow)" opacity=".35"/>`; }
  if(cfg.lake){ s+=`<ellipse cx="300" cy="206" rx="210" ry="16" style="fill:${mix(sky,40,"var(--snow)")}"/>`; }
  if(!cfg.water) s+=`<path d="${ridge(W,H,204,12,40,r)}" style="fill:var(--mtn)"/>`;
  if(cfg.front) s+=cfg.front(r);
  if(hi<5){ for(let i=0;i<40;i++) s+=`<circle cx="${(r()*W).toFixed(0)}" cy="${(r()*H*0.9).toFixed(0)}" r="${(1+r()*2).toFixed(1)}" style="fill:var(--snow)" opacity="${(0.5+r()*0.5).toFixed(2)}"/>`; }
  return s+`</svg>`;
}
function panorama(){
  const W=1200,H=300,r=rng(4242);
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="--mf:${mix("var(--mtn)",50,"var(--cold)")}"><defs><linearGradient id="panosky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:${mix("var(--cold)",55,"var(--paper)")}"/><stop offset=".55" style="stop-color:${mix("var(--cold)",22,"var(--paper)")}"/><stop offset="1" style="stop-color:${mix("var(--warm)",55,"var(--paper)")}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#panosky)"/>`;
  s+=`<circle cx="1070" cy="80" r="40" style="fill:${mix("var(--warm)",85,"var(--paper)")}"/>`;
  s+=`<path d="${ridge(W,H,150,50,30,r)}" style="fill:${mix("var(--snow)",72,"var(--cold)")}"/>`;
  s+=M.fuji(250,215,1.35);
  s+=`<path d="${ridge(W,H,215,30,30,r)}" style="fill:${mix("var(--mtn)",45,"var(--cold)")}"/>`;
  s+=M.volcano(1000,238,1.05);
  s+=`<rect x="760" y="238" width="440" height="62" style="fill:${mix("var(--warm)",30,"var(--mtn)")}"/>`;
  for(let i=0;i<9;i++) s+=`<rect x="${(780+r()*400).toFixed(0)}" y="${(246+r()*44).toFixed(0)}" width="${(30+r()*70).toFixed(0)}" height="2" style="fill:var(--snow)" opacity=".4"/>`;
  s+=`<path d="M0,${H} L0,244 ${Array.from({length:21},(_,i)=>`L${i*38},${(244-r()*14).toFixed(0)}`).join(" ")} L780,248 L780,${H} Z" style="fill:var(--mtn)"/>`;
  s+=M.pines(0,240,250,r,1.2)+M.pagoda(400,252,1.1)+M.torii(560,252,1.35)+M.boat(860,252,1.1)+M.steam(1110,240,1.2,r);
  for(let i=0;i<50;i++){const x=r()*560;s+=`<circle cx="${x.toFixed(0)}" cy="${(r()*260).toFixed(0)}" r="${(1+r()*2.2).toFixed(1)}" style="fill:var(--snow)" opacity="${(0.4+r()*0.5).toFixed(2)}"/>`;}
  return s+`</svg>`;
}

function viewAll(){
  const all = STOPS.flatMap(s=>s.tips);
  const active = state.filter.__all || "alle";
  const stopSel = state.stopSel || "alle";
  let pool = stopSel==="alle" ? all : STOPS.find(s=>s.id===stopSel).tips;
  const shown = active==="alle" ? pool : pool.filter(t=>t.c===active);
  return `<div class="view">
    <div class="eyebrow">Hele reis</div><h1>Alle tips</h1>
    <p class="lead">Alle ${all.length} tips van de route bij elkaar. Kies een thema, en eventueel een plek.</p>

}

    <ul class="plain">
      <li><b>Visit Japan Web:</b> vul je inreis- en douanegegevens vooraf in en je krijgt QR-codes voor de luchthaven. Niet verplicht, wel sneller; een papieren kaart in het vliegtuig mag ook. ${ext("https://vjw.digital.go.jp/","Visit Japan Web")}</li>
      <li><b>JESTA:</b> de nieuwe reisvergunning komt pas rond 2028. Voor jullie reis is die niet nodig; betaal niets aan sites die beweren dat het wel moet. ${ext("https://selfguidejapan.com/blog/japan-jesta-2026","Uitleg")}</li>
      <li><b>Op tijd boeken:</b> Shirakawa-go light-up, ryokans in Yumoto, Yudanaka en Kurokawa, de nachtboot en de vlucht naar Hongkong.</li>
      <li><b>Internet:</b> een eSIM voor Japan installeer je thuis en zet je aan bij landing.</li>
      <li><b>Verzekering:</b> check of je reisverzekering wintersport of sneeuwschoenwandelen dekt.</li>
    </ul>

    <h2 class="sec" id="p-suica">Suica: je OV-kaart in je telefoon</h2>
    <ul class="plain">
      <li><b>iPhone:</b> voeg een Suica toe in Apple Wallet en waardeer op met je eigen pas. Voor de meeste reizigers de beste optie. ${ext("https://atadistance.net/2025/03/06/welcome-suica-mobile-mobile-ticketing-for-the-inbound-reddit-crowd/","Uitleg")}</li>
      <li><b>Welcome Suica Mobile:</b> een app van JR East voor bezoekers, 180 dagen geldig, maar het restsaldo krijg je niet terug. ${ext("https://www.jreast.co.jp/e/press/pdf/0218wsm_en.pdf","JR East")}</li>
      <li><b>Android:</b> mobiele Suica werkt niet altijd met een niet-Japans account; haal dan een fysieke Welcome Suica op de luchthaven.</li>
      <li>Met Suica betaal je trein, metro, bus, kluisjes en de konbini. Voor Shinkansen en sneltreinen heb je een apart kaartje nodig.</li>
    </ul>

    <h2 class="sec" id="p-tickets">Kaartjes per traject</h2>
    <p>Een landelijke JR Pass is voor deze route waarschijnlijk niet voordelig: Nikko gaat met de (niet-JR) Tobu-trein en tussen Osaka en Kyushu vaar je. Losse kaartjes plus de NIKKO PASS, en eventueel een JR Kyushu-pas, zijn meestal goedkoper.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Traject</th><th>Vervoerder</th><th>Hoe en waar</th><th>Link</th></tr></thead>
      <tbody>${legs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]?ext(r[3][0],r[3][1]):"Op het station"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="small muted">Shinkansen-kaartjes kun je ook gewoon kopen bij de automaten (met Engels menu) of het loket Midori-no-Madoguchi op grote JR-stations. Online kopen kan met SmartEX (JR Central, West en Kyushu) en JR-EAST Train Reservation. ${ext("https://insidekyoto.com/how-to-buy-japan-rail-tickets-and-shinkansen-tickets-online","Uitleg")}</p>

    <h2 class="sec" id="p-geld">Geld en bagage</h2>
    <ul class="plain">
      <li><b>Contant:</b> neem altijd wat yen mee. Kleine ryokans, badhuizen, yatai en sommige guesthouses (zoals Beppu Guest House en Maruka Ryokan) nemen alleen contant. Pinnen kan bij de automaten van 7-Eleven.</li>
      <li><b>Tax-free:</b> het systeem verandert vanaf 1 november 2026; je betaalt de belasting eerst en krijgt die bij vertrek terug. ${ext("https://visarun.ai/blog/japan-visa-for-us-citizens-2026","Uitleg")}</li>
      <li><b>Takkyubin:</b> laat je grote tas voor weinig geld vooruitsturen naar je volgende adres, vooral handig voor de bus naar Yumoto, de nachtboot en de bussen in Kyushu. Vraag het bij de receptie of de konbini.</li>
      <li><b>Fooien:</b> geef je in Japan niet.</li>
    </ul>

    <h2 class="sec" id="p-onsen">Onsen-etiquette</h2>
    <ul class="plain">
      <li>Was je eerst helemaal op het krukje bij de douche, en ga dan pas het bad in.</li>
      <li>Je baadt naakt, gescheiden voor mannen en vrouwen. Het kleine handdoekje gaat niet in het water; leg het op je hoofd.</li>
      <li>Tatoeages worden niet overal toegelaten. Een privébad (kashikiri) is dan de oplossing; in Kurokawa kan dat bij veel ryokans.</li>
      <li>Drink water tussen de baden door en blijf niet te lang in heel heet water.</li>
    </ul>

    <h2 class="sec" id="p-dagelijks">Dagelijks</h2>
    <ul class="plain">
      <li><b>Apps:</b> Google Maps werkt goed voor treinen en bussen (met spoornummers); Google Translate met de camera voor menu's.</li>
      <li><b>Prullenbakken</b> zijn er bijna niet; neem een zakje mee.</li>
      <li><b>Kleding:</b> voor Nikko en Nagano echt warme lagen, een muts en waterdichte schoenen met grip; voor Kyushu lagen.</li>
      <li><b>Noodnummers:</b> politie 110, ambulance en brandweer 119.</li>
    </ul>
  </div>`;
}

    <div class="toc">${STOPS.filter(s=>EAT[s.id]).map(s=>`<a href="#eetlijst" data-jump="e-${s.id}">${s.name}</a>`).join("")}</div>
    ${STOPS.filter(s=>EAT[s.id]).map(s=>{const e=EAT[s.id];return `
      <h2 class="sec" id="e-${s.id}">${s.n} · ${s.name} <span class="kj" lang="ja" style="font-size:18px;color:var(--muted)">${s.kj}</span></h2>
      <p class="small"><b>Moet je proeven:</b> ${e.dishes.join(" · ")}</p>
      <div class="stays">${e.places.map(p=>`<article class="stay"><div class="row"><h3>${p.n}</h3><span class="pill${p.tag==="bib"||p.tag==="star"?" warm":""}">${EAT_TAG[p.tag]}</span></div>
        <p class="small" style="margin:6px 0 0">${p.w}</p>
        <div class="links"><span class="muted" style="font-family:var(--mono)">${p.p}</span>${p.m?ext(G(p.m),"Google Maps"):""}${p.l?ext(p.l,p.lt):""}</div></article>`).join("")}</div>
      ${e.src?`<p class="small muted">Bron: ${ext(e.src[0],e.src[1])}</p>`:""}`;}).join("")}
  </div>`;
}

const app = document.getElementById("app");
function render(){
  const h = (location.hash||"").replace("#","");
  let html, nav="home";
  const stop = STOPS.find(s=>s.id===h);
  if(stop){ html=viewStop(stop); nav=""; }
  else if(h==="alle-tips"){ html=viewAll(); nav="alle-tips"; }
  else if(h==="praktisch"){ html=viewPrakt(); nav="praktisch"; }
  else if(h==="paklijst"){ html=viewPack(); nav="paklijst"; }
  else if(h==="eetlijst"){ html=viewEat(); nav="eetlijst"; }
  else html=viewHome();
  app.innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.setAttribute("aria-current", a.dataset.nav===nav?"page":"false"));
  document.title = stop ? `${stop.name} · Japan per Spoor 2027` : "Japan per Spoor 2027";
}
app.addEventListener("click", e=>{
  const f = e.target.closest("[data-filter]");
  if(f){ state.filter[f.dataset.key]=f.dataset.filter; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(e.target.id==="packreset"){ packState={}; savePack(packState); render(); return; }
  const j = e.target.closest("[data-jump]");
  if(j){ e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth"}); }
});
app.addEventListener("change", e=>{
  if(e.target.id==="stopsel"){ state.stopSel=e.target.value; state.filter.__all="alle"; render(); }
  if(e.target.dataset && e.target.dataset.pack){
    packState[e.target.dataset.pack]=e.target.checked; savePack(packState);
    const total = PACK.reduce((n,g)=>n+g.i.length,0), done = Object.values(packState).filter(Boolean).length;
    const c=document.getElementById("packcount"), b=document.getElementById("packbar");
    if(c) c.textContent=done; if(b) b.style.left=(done/total*100)+"%";
  }
});
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
render();
</script>
